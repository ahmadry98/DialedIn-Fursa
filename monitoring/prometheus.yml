global:
  scrape_interval: 15s

scrape_configs:
  - job_name: dialedin-agent
    metrics_path: /metrics.prometheus
    static_configs:
      - targets:
          - agent:8000

  - job_name: espresso-mcp-health
    metrics_path: /metrics.prometheus
    static_configs:
      - targets:
          - espresso-mcp:9000
