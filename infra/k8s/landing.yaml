apiVersion: v1
kind: Secret
metadata:
  name: dialedin-landing-secrets
type: Opaque
stringData:
  NEXT_PUBLIC_SUPABASE_URL: replace-with-supabase-url
  SUPABASE_SERVICE_ROLE_KEY: replace-with-supabase-service-role-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dialedin-landing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dialedin-landing
  template:
    metadata:
      labels:
        app: dialedin-landing
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: landing
          image: 228281126655.dkr.ecr.us-east-1.amazonaws.com/dialedin-landing:checkpoint25-hardened2-1f75ced-amd64
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          ports:
            - name: http
              containerPort: 3002
          envFrom:
            - secretRef:
                name: dialedin-landing-secrets
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dialedin-landing-svc
spec:
  type: ClusterIP
  selector:
    app: dialedin-landing
  ports:
    - name: http
      port: 3002
      targetPort: http
