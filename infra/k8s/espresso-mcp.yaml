apiVersion: apps/v1
kind: Deployment
metadata:
  name: espresso-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: espresso-mcp
  template:
    metadata:
      labels:
        app: espresso-mcp
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: espresso-mcp
          image: 228281126655.dkr.ecr.us-east-1.amazonaws.com/dialedin-fursa-espresso-mcp:checkpoint25-ingress-1f75ced-amd64
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: DIALEDIN_PROFILE_STORAGE
              value: dynamodb
          envFrom:
            - secretRef:
                name: dialchat-agent-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 75m
              memory: 192Mi
            limits:
              cpu: 400m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: espresso-mcp-svc
spec:
  type: ClusterIP
  selector:
    app: espresso-mcp
  ports:
    - name: http
      port: 9000
      targetPort: http
