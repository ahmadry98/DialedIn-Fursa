apiVersion: apps/v1
kind: Deployment
metadata:
  name: dialedin-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dialedin-backend
  template:
    metadata:
      labels:
        app: dialedin-backend
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: backend
          image: 228281126655.dkr.ecr.us-east-1.amazonaws.com/dialedin-backend:checkpoint25-hardened-1f75ced-amd64
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          ports:
            - name: http
              containerPort: 8010
          env:
            - name: DIALEDIN_DJANGO_ALLOWED_HOSTS
              value: "*"
          readinessProbe:
            httpGet:
              path: /api/machines/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/machines/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dialedin-backend-svc
spec:
  type: ClusterIP
  selector:
    app: dialedin-backend
  ports:
    - name: http
      port: 8010
      targetPort: http
