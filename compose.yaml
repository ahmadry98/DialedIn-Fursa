services:
  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    environment:
      DIALEDIN_MEDIA_STORAGE_MODE: local
      DIALEDIN_LOCAL_MEDIA_UPLOAD_DIR: /app/data/uploads
      PROFILE_RESEARCH_AUTORUN: "false"
      DIALEDIN_PROFILE_STORAGE: json
    ports:
      - "8000:8000"
    volumes:
      - dialedin_uploads:/app/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  espresso-mcp:
    build:
      context: .
      dockerfile: services/espresso_mcp/Dockerfile
    environment:
      DIALEDIN_PROFILE_STORAGE: json
    ports:
      - "9000:9000"
    volumes:
      - dialedin_uploads:/app/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
      args:
        NEXT_PUBLIC_AGENT_API_URL: ${NEXT_PUBLIC_AGENT_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_AGENT_API_URL: ${NEXT_PUBLIC_AGENT_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      agent:
        condition: service_healthy

  dialedin-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DIALEDIN_DJANGO_ALLOWED_HOSTS: ${DIALEDIN_DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost,192.168.68.101,192.168.68.102}
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/machines/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  dialedin-landing:
    build:
      context: ../dialedin-landing
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:54321}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-local-placeholder-key}
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:54321}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-local-placeholder-key}
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      agent:
        condition: service_started
      espresso-mcp:
        condition: service_started

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  dialedin_uploads:
  prometheus_data:
  grafana_data:
