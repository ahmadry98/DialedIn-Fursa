name: Deploy Dev

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy for agent, espresso MCP, and frontend.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dev:
    name: Deploy DialChat to dev Kubernetes
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '228281126655' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN || secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
      AWS_GITHUB_ACTIONS_ROLE_NAME: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_NAME || 'DialedInGitHubActionsRole' }}
      KUBECONFIG: ${{ github.workspace }}/kubeconfig
      CONTROL_PLANE_SECURITY_GROUP_NAME: ${{ vars.CONTROL_PLANE_SECURITY_GROUP_NAME || 'ahmadry98-dialedin-dev-control-plane' }}
      DIALEDIN_MEDIA_UPLOAD_BUCKET: ${{ vars.DIALEDIN_MEDIA_UPLOAD_BUCKET }}
      DIALEDIN_PROFILE_TABLE: ${{ vars.DIALEDIN_PROFILE_TABLE }}
      DIALEDIN_SHOT_RESULTS_TABLE: ${{ vars.DIALEDIN_SHOT_RESULTS_TABLE }}
      DIALEDIN_MEDIA_CDN_BASE_URL: ${{ vars.DIALEDIN_MEDIA_CDN_BASE_URL || '' }}
      DIALEDIN_COGNITO_USER_POOL_ID: ${{ vars.DIALEDIN_COGNITO_USER_POOL_ID }}
      DIALEDIN_COGNITO_APP_CLIENT_ID: ${{ vars.DIALEDIN_COGNITO_APP_CLIENT_ID }}
      DIALEDIN_USAGE_TABLE: ${{ vars.DIALEDIN_USAGE_TABLE }}
      REVENUECAT_WEBHOOK_AUTHORIZATION: ${{ secrets.REVENUECAT_WEBHOOK_AUTHORIZATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show AWS role target
        run: |
          if [ -z "$AWS_ROLE_TO_ASSUME" ]; then
            echo "AWS_ROLE_TO_ASSUME is empty; static access-key fallback will be used."
          else
            echo "AWS_ROLE_TO_ASSUME=$AWS_ROLE_TO_ASSUME"
          fi

      - name: Validate AWS role target
        if: env.AWS_ROLE_TO_ASSUME != ''
        run: |
          expected="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${AWS_GITHUB_ACTIONS_ROLE_NAME}"
          if [ "$AWS_ROLE_TO_ASSUME" != "$expected" ]; then
            echo "Expected $expected but got $AWS_ROLE_TO_ASSUME" >&2
            exit 1
          fi

      - name: Configure AWS credentials with GitHub OIDC
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: dialedin-deploy-dev-${{ github.run_id }}

      - name: Configure AWS credentials with access keys
        if: env.AWS_ROLE_TO_ASSUME == ''
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Allow runner to Kubernetes API
        run: |
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          if [ -z "$RUNNER_IP" ]; then
            echo "Could not discover GitHub runner public IP." >&2
            exit 1
          fi

          CONTROL_PLANE_SECURITY_GROUP_ID=$(aws ec2 describe-security-groups \
            --filters "Name=tag:Name,Values=$CONTROL_PLANE_SECURITY_GROUP_NAME" \
            --query 'SecurityGroups[0].GroupId' \
            --output text)

          if [ -z "$CONTROL_PLANE_SECURITY_GROUP_ID" ] || [ "$CONTROL_PLANE_SECURITY_GROUP_ID" = "None" ]; then
            echo "Could not find control-plane security group named $CONTROL_PLANE_SECURITY_GROUP_NAME." >&2
            exit 1
          fi

          RUNNER_K8S_API_CIDR="$RUNNER_IP/32"
          echo "CONTROL_PLANE_SECURITY_GROUP_ID=$CONTROL_PLANE_SECURITY_GROUP_ID" >> "$GITHUB_ENV"
          echo "RUNNER_K8S_API_CIDR=$RUNNER_K8S_API_CIDR" >> "$GITHUB_ENV"

          aws ec2 authorize-security-group-ingress \
            --group-id "$CONTROL_PLANE_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=6443,ToPort=6443,IpRanges=[{CidrIp=$RUNNER_K8S_API_CIDR,Description='GitHub Actions deploy $GITHUB_RUN_ID'}]" \
            || echo "Ingress rule may already exist; continuing."

      - name: Write and validate kubeconfig
        env:
          DIALEDIN_DEV_KUBE_CONFIG_B64: ${{ secrets.DIALEDIN_DEV_KUBE_CONFIG_B64 }}
        run: |
          if [ -z "$DIALEDIN_DEV_KUBE_CONFIG_B64" ]; then
            echo "DIALEDIN_DEV_KUBE_CONFIG_B64 is missing. Add the base64 kubeconfig as a repository or dev environment secret." >&2
            exit 1
          fi

          printf '%s' "$DIALEDIN_DEV_KUBE_CONFIG_B64" | base64 --decode > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"

          if ! grep -q 'apiVersion:' "$KUBECONFIG"; then
            echo "Decoded kubeconfig does not look valid." >&2
            exit 1
          fi


          CONTROL_PLANE_PUBLIC_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$CONTROL_PLANE_SECURITY_GROUP_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          if [ -z "$CONTROL_PLANE_PUBLIC_IP" ] || [ "$CONTROL_PLANE_PUBLIC_IP" = "None" ]; then
            echo "No running control-plane instance was found. Start $CONTROL_PLANE_SECURITY_GROUP_NAME before deploying." >&2
            exit 1
          fi

          # EC2 public addresses change after a stop/start. Keep credentials in
          # the secret, but resolve the live API endpoint for this deployment.
          sed -i "s#server: https://[^[:space:]]*:6443#server: https://$CONTROL_PLANE_PUBLIC_IP:6443#" "$KUBECONFIG"
          echo "Using live Kubernetes API endpoint: $CONTROL_PLANE_PUBLIC_IP:6443"

          kubectl --kubeconfig "$KUBECONFIG" --insecure-skip-tls-verify=true config current-context
          kubectl --kubeconfig "$KUBECONFIG" --insecure-skip-tls-verify=true get deployments -n dev

      - name: Verify cluster prerequisites
        run: |
          kubectl --kubeconfig "$KUBECONFIG" --insecure-skip-tls-verify=true auth can-i create deployments.apps -n dev | grep -qx yes
          kubectl --kubeconfig "$KUBECONFIG" --insecure-skip-tls-verify=true auth can-i create secrets -n dev | grep -qx yes

      - name: Refresh ECR pull secret
        run: |
          ECR_PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION")
          kubectl --kubeconfig "$KUBECONFIG" --insecure-skip-tls-verify=true create secret docker-registry ecr-pull-secret -n dev             --docker-server="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"             --docker-username=AWS             --docker-password="$ECR_PASSWORD"             --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" --insecure-skip-tls-verify=true apply -f -

      - name: Patch image tags
        run: |
          TAG="${{ inputs.image_tag }}"
          REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          sed -i "s#image: .*/dialedin-fursa-agent:.*#image: $REGISTRY/dialedin-fursa-agent:$TAG#" infra/k8s/agent.yaml
          sed -i "s#image: .*/dialedin-fursa-espresso-mcp:.*#image: $REGISTRY/dialedin-fursa-espresso-mcp:$TAG#" infra/k8s/espresso-mcp.yaml
          if [ -n "$DIALEDIN_COGNITO_USER_POOL_ID" ] && [ -n "$DIALEDIN_COGNITO_APP_CLIENT_ID" ] && [ -n "$DIALEDIN_USAGE_TABLE" ]; then
            sed -i 's#DIALEDIN_AUTH_ENABLED: "false"#DIALEDIN_AUTH_ENABLED: "true"#' infra/k8s/agent.yaml
            sed -i 's#DIALEDIN_QUOTA_ENABLED: "false"#DIALEDIN_QUOTA_ENABLED: "true"#' infra/k8s/agent.yaml
            sed -i 's#DIALEDIN_USAGE_STORAGE: memory#DIALEDIN_USAGE_STORAGE: dynamodb#' infra/k8s/agent.yaml
            sed -i "s#DIALEDIN_COGNITO_USER_POOL_ID: .*#DIALEDIN_COGNITO_USER_POOL_ID: $DIALEDIN_COGNITO_USER_POOL_ID#" infra/k8s/agent.yaml
            sed -i "s#DIALEDIN_COGNITO_APP_CLIENT_ID: .*#DIALEDIN_COGNITO_APP_CLIENT_ID: $DIALEDIN_COGNITO_APP_CLIENT_ID#" infra/k8s/agent.yaml
            sed -i "s#DIALEDIN_USAGE_TABLE: .*#DIALEDIN_USAGE_TABLE: $DIALEDIN_USAGE_TABLE#" infra/k8s/agent.yaml
          fi
          if [ -n "$REVENUECAT_WEBHOOK_AUTHORIZATION" ]; then
            sed -i "s#REVENUECAT_WEBHOOK_AUTHORIZATION: .*#REVENUECAT_WEBHOOK_AUTHORIZATION: \"$REVENUECAT_WEBHOOK_AUTHORIZATION\"#" infra/k8s/agent.yaml
          fi
          sed -i "s#image: .*/dialedin-fursa-frontend:.*#image: $REGISTRY/dialedin-fursa-frontend:$TAG#" infra/k8s/frontend.yaml

      - name: Patch dev runtime resources
        run: |
          : "${DIALEDIN_MEDIA_UPLOAD_BUCKET:?DIALEDIN_MEDIA_UPLOAD_BUCKET repo variable is required}"
          : "${DIALEDIN_PROFILE_TABLE:?DIALEDIN_PROFILE_TABLE repo variable is required}"
          : "${DIALEDIN_SHOT_RESULTS_TABLE:?DIALEDIN_SHOT_RESULTS_TABLE repo variable is required}"

          sed -i "s#DIALEDIN_MEDIA_UPLOAD_BUCKET: .*#DIALEDIN_MEDIA_UPLOAD_BUCKET: $DIALEDIN_MEDIA_UPLOAD_BUCKET#" infra/k8s/agent.yaml
          sed -i "s#DIALEDIN_PROFILE_TABLE: .*#DIALEDIN_PROFILE_TABLE: $DIALEDIN_PROFILE_TABLE#" infra/k8s/agent.yaml
          sed -i "s#DIALEDIN_SHOT_RESULTS_TABLE: .*#DIALEDIN_SHOT_RESULTS_TABLE: $DIALEDIN_SHOT_RESULTS_TABLE#" infra/k8s/agent.yaml
          sed -i "s#DIALEDIN_MEDIA_CDN_BASE_URL: .*#DIALEDIN_MEDIA_CDN_BASE_URL: $DIALEDIN_MEDIA_CDN_BASE_URL#" infra/k8s/agent.yaml

      - name: Apply manifests
        run: |
          kubectl --kubeconfig "$KUBECONFIG" --insecure-skip-tls-verify=true apply -n dev -f infra/k8s/agent.yaml
          kubectl --kubeconfig "$KUBECONFIG" --insecure-skip-tls-verify=true apply -n dev -f infra/k8s/espresso-mcp.yaml
          kubectl --kubeconfig "$KUBECONFIG" --insecure-skip-tls-verify=true apply -n dev -f infra/k8s/frontend.yaml
          kubectl --kubeconfig "$KUBECONFIG" --insecure-skip-tls-verify=true apply -n dev -f infra/k8s/hpa.yaml

      - name: Wait for rollout
        run: |
          kubectl --kubeconfig "$KUBECONFIG" --insecure-skip-tls-verify=true rollout status -n dev deployment/dialchat-agent --timeout=240s
          kubectl --kubeconfig "$KUBECONFIG" --insecure-skip-tls-verify=true rollout status -n dev deployment/espresso-mcp --timeout=240s
          kubectl --kubeconfig "$KUBECONFIG" --insecure-skip-tls-verify=true rollout status -n dev deployment/dialchat-frontend --timeout=240s

      - name: Revoke runner Kubernetes API access
        if: always() && env.CONTROL_PLANE_SECURITY_GROUP_ID != '' && env.RUNNER_K8S_API_CIDR != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$CONTROL_PLANE_SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 6443 \
            --cidr "$RUNNER_K8S_API_CIDR" \
            || echo "Runner Kubernetes API ingress rule was already removed."
