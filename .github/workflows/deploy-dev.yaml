name: Deploy Dev

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy for agent, espresso MCP, and frontend.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dev:
    name: Deploy DialChat to dev Kubernetes
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '228281126655' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN || vars.AWS_TERRAFORM_ROLE_ARN }}
      KUBECONFIG: ${{ github.workspace }}/kubeconfig
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: dialedin-deploy-dev-${{ github.run_id }}

      - name: Configure AWS credentials with access keys
        if: env.AWS_ROLE_TO_ASSUME == ''
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        run: echo "${{ secrets.DIALEDIN_DEV_KUBE_CONFIG_B64 }}" | base64 --decode > "$KUBECONFIG"

      - name: Refresh ECR pull secret
        run: |
          ECR_PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION")
          kubectl --insecure-skip-tls-verify=true create secret docker-registry ecr-pull-secret -n dev             --docker-server="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"             --docker-username=AWS             --docker-password="$ECR_PASSWORD"             --dry-run=client -o yaml | kubectl --insecure-skip-tls-verify=true apply -f -

      - name: Patch image tags
        run: |
          TAG="${{ inputs.image_tag }}"
          REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          sed -i "s#image: .*/dialedin-fursa-agent:.*#image: $REGISTRY/dialedin-fursa-agent:$TAG#" infra/k8s/agent.yaml
          sed -i "s#image: .*/dialedin-fursa-espresso-mcp:.*#image: $REGISTRY/dialedin-fursa-espresso-mcp:$TAG#" infra/k8s/espresso-mcp.yaml
          sed -i "s#image: .*/dialedin-fursa-frontend:.*#image: $REGISTRY/dialedin-fursa-frontend:$TAG#" infra/k8s/frontend.yaml

      - name: Apply manifests
        run: |
          kubectl --insecure-skip-tls-verify=true apply -f infra/k8s/00-namespaces.yaml
          kubectl --insecure-skip-tls-verify=true apply -n dev -f infra/k8s/agent.yaml
          kubectl --insecure-skip-tls-verify=true apply -n dev -f infra/k8s/espresso-mcp.yaml
          kubectl --insecure-skip-tls-verify=true apply -n dev -f infra/k8s/frontend.yaml
          kubectl --insecure-skip-tls-verify=true apply -n dev -f infra/k8s/hpa.yaml

      - name: Wait for rollout
        run: |
          kubectl --insecure-skip-tls-verify=true rollout status -n dev deployment/dialchat-agent --timeout=240s
          kubectl --insecure-skip-tls-verify=true rollout status -n dev deployment/espresso-mcp --timeout=240s
          kubectl --insecure-skip-tls-verify=true rollout status -n dev deployment/dialchat-frontend --timeout=240s
