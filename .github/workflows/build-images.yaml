name: Build Images

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag. Defaults to git SHA.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build and push DialChat images
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '228281126655' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN || secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
      AWS_GITHUB_ACTIONS_ROLE_NAME: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_NAME || 'DialedInGitHubActionsRole' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show AWS role target
        run: |
          if [ -z "$AWS_ROLE_TO_ASSUME" ]; then
            echo "AWS_ROLE_TO_ASSUME is empty; static access-key fallback will be used."
          else
            echo "AWS_ROLE_TO_ASSUME=$AWS_ROLE_TO_ASSUME"
          fi

      - name: Validate AWS role target
        if: env.AWS_ROLE_TO_ASSUME != ''
        run: |
          expected="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${AWS_GITHUB_ACTIONS_ROLE_NAME}"
          if [ "$AWS_ROLE_TO_ASSUME" != "$expected" ]; then
            echo "Expected $expected but got $AWS_ROLE_TO_ASSUME" >&2
            exit 1
          fi

      - name: Show GitHub OIDC claims
        if: env.AWS_ROLE_TO_ASSUME != ''
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
          oidc = json.loads(urllib.request.urlopen(req, timeout=20).read())["value"]
          payload = oidc.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload.encode()))
          for key in ["iss", "aud", "sub", "repository", "repository_id", "repository_owner", "ref", "ref_type", "event_name", "workflow_ref"]:
              print(f"{key}={claims.get(key)}")
          PY

      - name: Configure AWS credentials with GitHub OIDC
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: dialedin-build-${{ github.run_id }}

      - name: Configure AWS credentials with access keys
        if: env.AWS_ROLE_TO_ASSUME == ''
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA::7}-amd64"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/dialedin-fursa-agent:${{ steps.tag.outputs.tag }}

      - name: Build and push espresso MCP
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/espresso_mcp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/dialedin-fursa-espresso-mcp:${{ steps.tag.outputs.tag }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_AGENT_API_URL=/api
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/dialedin-fursa-frontend:${{ steps.tag.outputs.tag }}
